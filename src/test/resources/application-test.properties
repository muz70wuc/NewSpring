spring.application.name=basics

# PostgreSQL Verbindung
spring.datasource.url=jdbc:postgresql://localhost:5432/DS-Portfolio
spring.datasource.username=postgres
spring.datasource.password=dein_passwort
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Einstellungen
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


# Session & Header
server.servlet.session.timeout=15m
server.forward-headers-strategy=native

# E-Mail Dummy-Konfiguration für CI/CD & Tests
spring.mail.host=smtp.1und1.de
spring.mail.port=587
spring.mail.username=dummy@beispiel.de
spring.mail.password=dummyPassword123
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

app.mail.target-address=empfaenger@beispiel.de