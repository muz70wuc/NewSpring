spring.application.name=basics

# H2 Datenbank-Konfiguration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Konsole & DDL
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update

# Session & Header
server.servlet.session.timeout=15m
server.forward-headers-strategy=native

# E-Mail Dummy-Konfiguration für CI/CD & Tests
spring.mail.host=smtp.1und1.de
spring.mail.port=587
spring.mail.username=dummy@beispiel.de
spring.mail.password=dummyPassword123
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

app.mail.target-address=empfaenger@beispiel.de