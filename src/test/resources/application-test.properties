spring.application.name=basics

# H2 In-Memory-Datenbank für Tests (kompatibel mit PostgreSQL-Syntax)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Einstellungen für H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop


# Session & Header
server.servlet.session.timeout=15m
server.forward-headers-strategy=native

# E-Mail Dummy-Konfiguration für CI/CD & Tests
spring.mail.host=smtp.1und1.de
spring.mail.port=587
spring.mail.username=dummy@beispiel.de
spring.mail.password=dummyPassword123
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

app.mail.target-address=empfaenger@beispiel.de