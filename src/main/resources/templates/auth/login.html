<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    th:replace="~{fragments/base :: layout(~{::title}, ~{::section})}">
    <head>
        <title>Login - DS-Portfolio</title>
    </head>
    <body>
        <section>
            <h2>Anmelden</h2>

            <div th:if="${param.registered}" style="background-color: #d4edda; color: #155724; padding: 0.75rem; border-radius: 4px; margin-bottom: 1rem;">
                Registrierung erfolgreich! Du kannst dich jetzt einloggen.
            </div>

            <div th:if="${param.error}" style="background-color: #f8d7da; color: #721c24; padding: 0.75rem; border-radius: 4px; margin-bottom: 1rem;">
                Ungültiger Benutzername oder Passwort.
            </div>

            <form th:action="@{/login}" method="post">
                <label for="username">Benutzername</label>
                <input type="text" id="username" name="username" required>

                <label for="password">Passwort</label>
                <input type="password" id="password" name="password" required>

                <button type="submit" style="margin-top: 1rem;">Einloggen</button>
            </form>

            <p style="margin-top: 1.5rem;">Noch kein Account erstellt? <a th:href="@{/register}">Hier registrieren</a></p>
        </section>
    </body>
</html>
