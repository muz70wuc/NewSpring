<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    th:replace="~{fragments/base :: layout(~{::title}, ~{::section})}">
    <head>
        <title>Profil-Einstellungen - DS-Portfolio</title>
    </head>
    <body>
        <section>
            <h2>Profil & Firmen-Informationen</h2>
            <p>Ergänze hier deine E-Mail-Adresse und Kontaktdaten.</p>

            <!-- Hinweis für Erst-Einlogger -->
            <div th:if="${infoMessage}" style="background-color: #e2f0fb; color: #0c5460; padding: 1rem; border-radius: 4px; margin-bottom: 1rem;">
                <span th:text="${infoMessage}"></span>
            </div>

            <!-- Erfolgsmeldung nach dem Speichern -->
            <div th:if="${successMessage}" style="background-color: #d4edda; color: #155724; padding: 1rem; border-radius: 4px; margin-bottom: 1rem;">
                <span th:text="${successMessage}"></span>
            </div>

            <form th:action="@{/profile}" th:object="${profileDto}" method="post">
                
                <label for="email">E-Mail-Adresse</label>
                <input type="email" id="email" th:field="*{email}" placeholder="name@firma.de">
                <small style="color: red;" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></small>

                <label for="phoneNumber">Telefonnummer</label>
                <input type="tel" id="phoneNumber" th:field="*{phoneNumber}" placeholder="+49 170 1234567">
                <small style="color: red;" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></small>

                <label for="companyName">Firmenname</label>
                <input type="text" id="companyName" th:field="*{companyName}" placeholder="z. B. Muster GmbH">
                <small style="color: red;" th:if="${#fields.hasErrors('companyName')}" th:errors="*{companyName}"></small>

                <label for="contactPerson">Ansprechpartner / Name</label>
                <input type="text" id="contactPerson" th:field="*{contactPerson}" placeholder="z. B. Max Mustermann">
                <small style="color: red;" th:if="${#fields.hasErrors('contactPerson')}" th:errors="*{contactPerson}"></small>

                <button type="submit" style="margin-top: 1.5rem;">Einstellungen speichern</button>
            </form>
        </section>
    </body>
</html>
