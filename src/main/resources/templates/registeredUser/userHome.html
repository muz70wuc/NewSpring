<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    th:replace="~{fragments/base :: layout(~{::title}, ~{::section})}">
    <head>
        <title>Home - DS-Portfolio</title>
    </head>
    <body>
        <section>
            <h2>Willkommen, <span th:text="${username}">Benutzer</span>!</h2>
            <p>Du befindest dich im geschützten Mitgliederbereich.</p>

            <!-- Hier sind alle gespeicherten Nutzerdaten bis auf das Passwort -->
            <div style="margin-top: 2rem; border: 1px solid #ccc; padding: 1rem; border-radius: 4px;">
                <h3>Deine gespeicherten Daten:</h3>
                <p><strong>E-Mail-Adresse:</strong> <span th:text="${email}"></span></p>
                <p><strong>Telefonnummer:</strong> <span th:text="${phoneNumber}"></span></p>
                <p><strong>Firmenname:</strong> <span th:text="${companyName}"></span></p>
                <p><strong>Ansprechpartner:</strong> <span th:text="${contactPerson}"></span></p>
            </div>
        </section>
    </body>
</html>
