<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/base :: layout(~{::title}, ~{::section})}">
    <head>
        <title>Startseite - DS-Portfolio</title>
    </head>
    <body>
        <section>
            <h2>Herzlich Willkommen!</h2>
            <p>Das ist die öffentliche Startseite unserer Spring Boot Anwendung.</p>

            <div th:if="${successMessage}" style="background-color: #d4edda; color: #155724; padding: 1rem; border-radius: 4px; margin-bottom: 1rem;">
                <span th:text="${successMessage}"></span>
            </div>

            <!-- WENN DER NUTZER ANGEMELDET IST -->
            <div sec:authorize="isAuthenticated()" style="margin-top: 2rem;">
                <p>Du bist aktuell angemeldet als: <strong sec:authentication="name">User</strong></p>
                <div style="display: flex; gap: 1rem;">
                    <a th:href="@{/userHome}" role="button">Zum Dashboard</a>
                </div>
            </div>
        </section>
    </body>
</html>
