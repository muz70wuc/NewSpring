name: Java CI & Spring Context Check

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 1. Quellcode auschecken
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Java JDK 21 einrichten (inkl. Maven-Dependency-Caching)
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    # 3. Berechtigungen für den Maven Wrapper sicherstellen
    - name: Make mvnw executable
      run: chmod +x mvnw
      continue-on-error: true

    # 4. Alle Tests ausführen (Unit-Tests + Context-Loads-Test)
    - name: Run Application Tests
      run: ./mvnw clean test || mvn clean test

    # 5. Testberichte bei Fehlschlägen als Artifact sichern
    - name: Upload Test Results on Failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: surefire-test-reports
        path: target/surefire-reports/